[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corrosion-simulator"
version = "0.1.0"
description = "Physics-informed and ML-assisted electrochemical corrosion simulator for semiconductor wet cleaning"
readme = "GLOSSARY.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "streamlit>=1.50.0",
    "plotly>=5.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["corrosion_simulator*"]
